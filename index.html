<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fdcff">
<title>陪彤｜Chrome 試玩版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fdcff;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:linear-gradient(#bcecff,#73c9f2)}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex}
#home{padding:22px}
#hero{width:min(82vw,390px);aspect-ratio:1/1;object-fit:cover;border-radius:28px;box-shadow:0 12px 35px #267eaa55}
h1{margin:14px 0 5px;color:#fff;text-shadow:0 3px 8px #3d8eb055;font-size:42px;letter-spacing:7px}
.coins{color:#fff;font-weight:800;font-size:21px;margin:4px 0 18px}
button{border:0;border-radius:18px;padding:16px 28px;margin:7px;width:min(78vw,330px);font-size:21px;font-weight:900;color:#23617e;background:#fff;box-shadow:0 7px 0 #55a9cf}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #55a9cf}
#battle{background:linear-gradient(#a8e8ff,#55b7e8)}
#hud{position:absolute;top:max(18px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;z-index:5;color:#fff;font-weight:900;text-shadow:0 2px 4px #28749a}
#arena{position:absolute;inset:0}
#player{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);z-index:3}
.head{position:absolute;width:42px;height:42px;left:6px;top:6px;border-radius:50%;background:#f5fbff;border:3px solid #5aa9cf}
.ear{position:absolute;width:16px;height:18px;background:#f5fbff;border:3px solid #5aa9cf;top:0;left:1px;border-radius:9px 9px 2px 2px;transform:rotate(-25deg)}
.ear.r{right:1px;left:auto;transform:rotate(25deg)}
.tail{position:absolute;width:23px;height:34px;background:#eefaff;border:3px solid #5aa9cf;border-radius:50%;top:17px;z-index:-1}
.tail.l{left:-9px;transform:rotate(25deg)} .tail.r{right:-9px;transform:rotate(-25deg)}
.eye{position:absolute;width:6px;height:9px;border-radius:50%;background:#4b91c1;top:22px;z-index:2}.eye.l{left:18px}.eye.r{right:18px}
.monster{position:absolute;width:42px;height:42px;border-radius:50%;background:#d7f5ff;border:4px solid #4c9fc8;box-shadow:0 5px 10px #287aa855;z-index:2}
.monster:before,.monster:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#4d86a5;top:11px}.monster:before{left:8px}.monster:after{right:8px}
#joy{position:absolute;left:20px;bottom:25px;width:116px;height:116px;border-radius:50%;background:#ffffff55;border:3px solid #ffffff99;z-index:10}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#fff9;transform:translate(-50%,-50%);box-shadow:0 3px 12px #287aa855}
#attack{position:absolute;right:22px;bottom:32px;width:94px;height:94px;border-radius:50%;padding:0;margin:0;background:#ffffffdd;color:#3787ae;z-index:10;box-shadow:0 8px 0 #55a9cf}
#shop{padding:25px;background:linear-gradient(#c8f3ff,#75c9ed)}
#shop h2{color:#fff;font-size:34px;margin:0 0 10px;text-shadow:0 3px 7px #3d8eb055}
.item{width:min(88vw,400px);background:#ffffffaa;border:2px solid #fff;border-radius:20px;padding:13px;margin:7px;display:flex;align-items:center;justify-content:space-between;color:#28627d;font-weight:800}
.item button{width:auto;margin:0;padding:10px 15px;font-size:15px;box-shadow:none;background:#fff}
.small{font-size:13px;opacity:.8}
</style>
</head>
<body>
<div id="app">
<section id="home" class="screen active">
<h1>陪彤</h1><div class="coins">🪙 <span id="homeCoins">0</span></div>
<button id="start">開始遊戲</button><button id="shopBtn">商店</button>
</section>

<section id="shop" class="screen">
<h2>商店</h2><div class="coins">🪙 <span id="shopCoins">0</span></div>
<div class="item"><span>⚔️ 武器<br><span class="small">攻擊範圍 +25%</span></span><button data-buy="weapon">🪙 5</button></div>
<div class="item"><span>🛡️ 防具<br><span class="small">受到傷害減少</span></span><button data-buy="armor">🪙 8</button></div>
<div class="item"><span>💙 強化<br><span class="small">最大 HP +20</span></span><button data-buy="hpUp">🪙 6</button></div>
<button id="backHome">返回</button>
</section>

<section id="battle" class="screen">
 
 <button onclick="playing=false;show('home');updateCoins()" style="position:absolute;top:70px;left:20px;width:auto;margin:0;padding:10px 16px;z-index:20;">← 首頁</button>
<div id="hud"><span>❤️ <span id="hp">100</span></span><span>波數 <span id="wave">1</span></span><span>🪙 <span id="battleCoins">0</span></span></div>
<div id="arena"><div id="player"><div class="tail l"></div><div class="tail r"></div><div class="ear"></div><div class="ear r"></div><div class="head"></div><div class="eye l"></div><div class="eye r"></div></div></div>
<div id="joy"><div id="stick"></div></div><button id="attack">⚔️</button>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const state={
 coins:Number(localStorage.coins||0),
 deaths:Number(localStorage.deaths||0),
 weapon:localStorage.weapon==="1",
 armor:localStorage.armor==="1",
 hpUp:localStorage.hpUp==="1"
};
let hp=100,wave=1,kills=0,playing=false,last=0,spawnT=0,monsters=[],joyX=0,joyY=0,joyActive=false;
const player={x:innerWidth/2,y:innerHeight*.58};

function save(){
 localStorage.coins=state.coins;
 localStorage.deaths=state.deaths;
 localStorage.weapon=state.weapon?1:0;
 localStorage.armor=state.armor?1:0;
 localStorage.hpUp=state.hpUp?1:0;
}
function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");
}
function updateCoins(){
 ["homeCoins","shopCoins","battleCoins"].forEach(id=>$(id).textContent=state.coins);
}
function fullscreen(){
 try{
   if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
 }catch(e){}
}
function startGame(){
 fullscreen();
 show("battle");
 playing=true;
 hp=state.hpUp?120:100;
 wave=1;kills=0;monsters=[];
 player.x=innerWidth/2;player.y=innerHeight*.58;
 render();last=performance.now();requestAnimationFrame(loop);
}
function spawn(){
 const a=Math.random()*Math.PI*2;
 const r=Math.max(innerWidth,innerHeight)*.58;
 monsters.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r});
}
function hit(){
 const range=state.weapon?105:84;
 monsters=monsters.filter(m=>{
   const d=Math.hypot(m.x-player.x,m.y-player.y);
   if(d<range){
     kills++;
     if(kills%10===0)state.coins++;
     if(kills%15===0)wave++;
     return false;
   }
   return true;
 });
 save();updateCoins();
}
function damage(){
 hp-=state.armor?0:1;
 if(hp<=0){
   state.deaths++;
   save();
   playing=false;
   alert("倒下了！\n本次擊倒 "+kills+" 隻怪物");
   show("home");updateCoins();
 }
}
function loop(t){
 if(!playing)return;
 const dt=Math.min(.035,(t-last)/1000);last=t;
 const speed=310*dt;
 player.x+=joyX*speed;player.y+=joyY*speed;
 player.x=Math.max(30,Math.min(innerWidth-30,player.x));
 player.y=Math.max(70,Math.min(innerHeight-50,player.y));
 spawnT-=dt;
 if(spawnT<=0){
   spawn();
   spawnT=Math.max(.65,1.55-wave*.09);
 }
 const ms=(45+wave*8)*dt;
 monsters.forEach(m=>{
   const dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;
   m.x+=dx/d*ms;m.y+=dy/d*ms;
 });
 for(const m of monsters){
   if(Math.hypot(m.x-player.x,m.y-player.y)<42){
     m.x=-999;damage();
   }
 }
 monsters=monsters.filter(m=>m.x>-900);
 render();
 $("wave").textContent=wave;$("hp").textContent=hp;
 requestAnimationFrame(loop);
}
function render(){
 $("player").style.left=player.x+"px";
 $("player").style.top=player.y+"px";
 document.querySelectorAll(".monster").forEach(x=>x.remove());
 monsters.forEach(m=>{
   const e=document.createElement("div");
   e.className="monster";
   e.style.left=(m.x-21)+"px";e.style.top=(m.y-21)+"px";
   $("arena").appendChild(e);
 });
}

$("start").onclick=startGame;
$("shopBtn").onclick=()=>{updateCoins();show("shop")};
$("backHome").onclick=()=>show("home");
$("attack").addEventListener("pointerdown",e=>{e.preventDefault();hit()});

document.querySelectorAll("[data-buy]").forEach(b=>{
 b.onclick=()=>{
   const k=b.dataset.buy;
   const cost=k==="weapon"?5:k==="armor"?8:6;
   if(state[k])return;
   if(state.coins>=cost){
     state.coins-=cost;state[k]=true;save();updateCoins();b.textContent="已購買";
   }
 };
});

const joy=$("joy"),stick=$("stick");
function joyMove(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,max=48,s=Math.min(1,max/len);
 joyX=dx/len*s;joyY=dy/len*s;
 stick.style.transform=`translate(calc(-50% + ${dx*s}px),calc(-50% + ${dy*s}px))`;
}
joy.onpointerdown=e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyMove(e)};
joy.onpointermove=e=>{if(joyActive)joyMove(e)};
joy.onpointerup=joy.onpointercancel=()=>{
 joyActive=false;joyX=joyY=0;stick.style.transform="translate(-50%,-50%)";
};

updateCoins();save();
</script>
</body>
</html>
